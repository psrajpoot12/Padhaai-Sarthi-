<h4 style="margin-bottom:10px">मॉक टेस्ट</h4><div class="grid">`+
Object.keys(D).map(k=>`<div class="sub" style="background:${D[k].c}" onclick="intro('${k}')"><span>${D[k].e}</span>${D[k].n}<small>${D[k].q.length} प्र. • ${MIN} मिनट</small></div>`).join('')+`</div></div>`)}
function intro(k){T=k;const d=D[k];
$(`<div class="top"><button onclick="home()">←</button>${d.n} मॉक टेस्ट</div>
<div class="card"><h2>${d.e} ${d.n}</h2><p style="color:#667">${d.q.length} प्रश्न | ${MIN} मिनट</p>
<h4 style="margin:16px 0 4px">टेस्ट के निर्देश</h4>
<div class="info"><span>कुल प्रश्न</span><b>${d.q.length}</b></div>
<div class="info"><span>समय सीमा</span><b>${MIN} मिनट</b></div>
<div class="info"><span>नेगेटिव मार्किंग</span><b>0</b></div>
<div class="info"><span>समय खत्म होने पर टेस्ट अपने-आप सबमिट हो जाएगा</span></div>
<div class="info"><span>सबमिट करने से पहले जवाब रिव्यू कर सकते हैं</span></div>
<button class="btn" onclick="start()">टेस्ट शुरू करें</button></div>`)}
function start(){const n=D[T].q.length;cur=0;ans=Array(n).fill(-1);mk=Array(n).fill(false);left=MIN*60;
clearInterval(tm);tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e)e.textContent=fmt(left);if(left<=0){clearInterval(tm);timeUp()}},1000);show()}
function fmt(s){s=Math.max(s,0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function show(){const d=D[T],n=d.q.length,q=d.q[cur];
$(`<div class="top"><button onclick="if(confirm('टेस्ट छोड़ना है?'))home()">←</button>${d.n} मॉक टेस्ट<span class="timer" id="tm">${fmt(left)}</span></div>
<div class="card"><small>प्र. ${cur+1} / ${n}</small><div class="bar"><i style="width:${(cur+1)/n*100}%"></i></div>
<span class="qn">Q.${cur+1}</span><div class="q">${q[0]}</div>`+
q[1].map((o,i)=>`<div class="opt ${ans[cur]==i?'sel':''}" onclick="pick(${i})"><b>${L[i]}</b>${o}</div>`).join('')+
`<div class="row"><button class="btn lt mark ${mk[cur]?'on':''}" onclick="mark()">🔖 ${mk[cur]?'मार्क किया':'रिव्यू के लिए मार्क'}</button>
${cur<n-1?`<button class="btn alt" onclick="go(1)">अगला ›</button>`:`<button class="btn" onclick="summary()">पूरा करें</button>`}</div>
${cur>0?`<button class="btn lt" onclick="go(-1)">‹ पिछला</button>`:''}</div>`)}
function pick(i){ans[cur]=i;show()}
function mark(){mk[cur]=!mk[cur];show()}
function go(x){cur+=x;show()}
function timeUp(){$(`<div class="top"></div><div class="card" style="text-align:center"><div class="big">⏰ समय समाप्त!</div><p>आपका टेस्ट अब अपने-आप सबमिट होगा।</p><button class="btn" onclick="result()">रिज़ल्ट देखें</button></div>`)}
function summary(){const d=D[T],a=ans.filter(x=>x>=0).length;
$(`<div class="top"><button onclick="show()">←</button>टेस्ट सारांश</div>
<div class="card"><h3>${d.n} मॉक टेस्ट</h3>
<div class="stats"><div><b class="g">${a}</b>हल किए</div><div><b class="y">${d.q.length-a}</b>छोड़े गए</div><div><b style="color:#2563eb">${mk.filter(x=>x).length}</b>मार्क किए</div></div>
<p style="text-align:center;color:#667;font-size:13px">क्या आप सबमिट करना चाहते हैं? सबमिट के बाद बदलाव नहीं हो सकते।</p>
<button class="btn" onclick="result()">टेस्ट सबमिट करें</button><button class="btn lt" onclick="cur=0;show()">जवाब रिव्यू करें</button></div>`)}
function result(){clearInterval(tm);const d=D[T],n=d.q.length;
let c=0,w=0;d.q.forEach((q,i)=>{if(ans[i]<0)return;ans[i]==q[2]?c++:w++});const u=n-c-w,used=MIN*60-Math.max(left,0);
$(`<div class="top"><button onclick="home()">←</button>टेस्ट रिज़ल्ट</div>
<div class="card" style="text-align:center"><div style="font-size:48px">🏆</div>
<h2>${c/n>=.8?'शाबाश!':c/n>=.5?'अच्छा प्रयास!':'लगे रहो!'}</h2>
<div class="big">${c}/${n}</div><p style="color:#667">सही</p>
<div class="stats"><div><b class="g">${c}</b>सही</div><div><b class="r">${w}</b>गलत</div><div><b class="y">${u}</b>छोड़े गए</div></div>
<div class="stats"><div><b>${fmt(used)}</b>लगा समय</div><div><b>${c}/${n}</b>कुल अंक</div></div>
<button class="btn alt" onclick="review()">👁 हल देखें</button><button class="btn" onclick="intro(T)">↻ दोबारा करें</button></div>`)}
function review(){const d=D[T];
$(`<div class="top"><button onclick="result()">←</button>जवाब रिव्यू</div><div class="card">`+
d.q.map((q,i)=>{const a=ans[i],ok=a==q[2];
return `<div class="rv"><b>${i+1}. ${q[0]}</b>`+
q[1].map((o,j)=>`<div class="opt ${j==q[2]?'ok':(j==a?'bad':'')}" style="padding:8px;margin:6px 0"><b>${L[j]}</b>${o}</div>`).join('')+
`<span class="tag ${a<0?'y':ok?'g':'r'}">${a<0?'छोड़ा गया':ok?'सही ✓':'गलत ✗'}</span></div>`}).join('')+
`<button class="btn" onclick="home()">होम</button></div>`)}
home();
</script></body></html>
