<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>पढ़ाई का सारथी</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f6fc;--card:#fff;--tx:#0f1b3d;--mut:#64748b;--gold:#f5b301;--bd:#e2e8f0;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162036;--tx:#e8eefc;--mut:#94a3b8;--bd:#273553}}
html{background:#0b1b3a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari",system-ui,sans-serif;padding-bottom:84px;line-height:1.5;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:14px}
.hd{background:linear-gradient(135deg,#0b1b3a,#1e3a8a);color:#fff;padding:16px 16px 22px;border-radius:0 0 24px 24px}
.hd.sm{padding:14px 16px;display:flex;align-items:center;gap:10px;font-size:18px}
.hd h2{margin:12px 0 0}.hd p{margin:0;opacity:.85}
.top{display:flex;align-items:center;gap:10px;font-size:20px}
.lg{width:44px;height:44px;border-radius:50%}
.qt{margin-top:12px;background:rgba(255,255,255,.12);border-radius:14px;padding:12px;font-size:15px}
.bk{background:none;border:0;color:#fff;font-size:24px;min-width:40px;min-height:40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card.two{display:flex;justify-content:space-around;text-align:center}
.card.two div,.three div{display:flex;flex-direction:column}
.c{text-align:center}.mut{color:var(--mut)}
h3{display:flex;justify-content:space-between;margin:16px 0 10px}
h3 a{color:#2563eb;font-size:14px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 4px;color:var(--tx);font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px}
.ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;font-size:20px;color:var(--mut)}
.gr{flex:1;font-size:16px;color:var(--tx)}.gr small{display:block;font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px}
.num{width:36px;height:36px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx);flex:none;font-size:16px}
.num.ok{background:var(--ok);color:#fff}
.big{display:block;width:100%;min-height:52px;margin-top:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-size:17px;font-weight:600}
.big.gold{background:var(--gold);color:#1a1200;border:0}.big.grn{background:var(--ok);color:#fff;border:0}
.opt{display:flex;gap:10px;align-items:center;width:100%;min-height:50px;margin-top:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-size:17px;text-align:left;padding:8px 12px}
.opt.ok{border-color:var(--ok);background:rgba(34,197,94,.15)}
.opt.bad{border-color:var(--bad);background:rgba(239,68,68,.15)}
.three{display:flex;justify-content:space-around;text-align:center;margin-top:12px}
.sp{display:flex;justify-content:space-between}
.av{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#1a1200;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
#clock{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;margin:16px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600}
nav button span{display:block;font-size:22px}nav button.on{color:#2563eb}
.gate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);overflow:auto;padding:24px 16px;display:flex;align-items:center;justify-content:center}
.gate .card{width:100%;max-width:420px}.gate .lg{width:88px;height:88px;display:block;margin:0 auto 8px}
.inp{display:block;width:100%;box-sizing:border-box;min-height:50px;margin-top:10px;padding:0 12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:17px}
.err{color:var(--bad);min-height:24px;margin:8px 0 0}
.lnk{background:none;border:0;color:#2563eb;font:inherit;font-size:15px;margin-top:10px;min-height:44px;width:100%}
.pri{display:block;width:100%;min-height:50px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font:inherit;font-size:17px;font-weight:600;margin-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <button data-t="home" onclick="go('home')"><span>🏠</span>होम</button>
  <button data-t="courses" onclick="go('courses')"><span>📖</span>कोर्स</button>
  <button data-t="practice" onclick="go('practice')"><span>🎯</span>प्रैक्टिस</button>
  <button data-t="progress" onclick="go('progress')"><span>📊</span>प्रोग्रेस</button>
  <button data-t="profile" onclick="go('profile')"><span>👤</span>प्रोफ़ाइल</button>
</nav>

function act(n){const d=ld(),t=lk(new Date());d.days=d.days||[];if(!d.days.includes(t))d.days.push(t);d.days=d.days.slice(-90);if(!d.gd||d.gd.d!==t)d.gd={d:t,n:0};d.gd.n+=n||0;sv(d)}
function streak(){const d=ld().days||[];let c=new Date(),s=0;if(!d.includes(lk(c)))c.setDate(c.getDate()-1);while(d.includes(lk(c))){s++;c.setDate(c.getDate()-1)}return s}
function done(i){const dn=ld().done||{};return S[i].L.filter((l,j)=>dn[S[i].id+j]).length}

R.courses=()=>{
  app.innerHTML=hdr('कोर्स')+'<main>'+S.map((s,i)=>'<div class="row" onclick="go(\'subj\','+i+')"><span class="ic" style="background:'+s.c+'">'+s.i+'</span><div class="gr"><b>'+s.n+'</b><small class="mut">'+done(i)+'/'+s.L.length+' अध्याय पूरे</small><div class="bar"><i style="width:'+pct(i)+'%;background:'+s.c+'"></i></div></div>›</div>').join('')+'</main>';
};
R.subj=i=>{
  const s=S[i],dn=ld().done||{};
  app.innerHTML=hdr(s.n,"go('courses')")+'<main><div class="card" style="background:'+s.c+';color:#fff"><b>'+s.i+' '+s.n+'</b><br><small>अध्याय • नोट्स • टेस्ट</small></div>'+
  s.L.map((l,j)=>'<div class="row" onclick="go(\'lesson\','+i+','+j+')"><span class="num '+(dn[s.id+j]?'ok':'')+'">'+(dn[s.id+j]?'✓':j+1)+'</span><div class="gr"><b>'+l[0]+'</b><small class="mut">'+(dn[s.id+j]?'पूरा हुआ':'अभी बाकी')+'</small></div>›</div>').join('')+
  '<button class="big gold" onclick="startQ('+i+')">📝 '+s.n+' का टेस्ट दें</button></main>';
};
R.lesson=(i,j)=>{
  const s=S[i],l=s.L[j],ok=(ld().done||{})[s.id+j];
  app.innerHTML=hdr(l[0],"go('subj',"+i+")")+'<main><div class="card"><b>मुख्य बिंदु</b><ul>'+l[1].map(x=>'<li>'+x+'</li>').join('')+'</ul></div><button class="big '+(ok?'':'grn')+'" id="mk">'+(ok?'✓ पूरा हो चुका है':'✓ पूरा हुआ चिह्नित करें')+'</button><p class="mut">परीक्षा से पहले अपनी किताब से तथ्य मिला लें।</p></main>';
  $('#mk').onclick=()=>{const d=ld();d.done=d.done||{};if(!d.done[s.id+j]){d.done[s.id+j]=1;sv(d);act(1)}go('subj',i)};
};
R.practice=()=>{
  const sc=ld().sc||{};
  app.innerHTML=hdr('प्रैक्टिस टेस्ट')+'<main><div class="card"><b>🎯 विषय चुनकर टेस्ट दें</b><br><small class="mut">हर टेस्ट में अधिकतम 10 प्रश्न</small></div>'+
  S.map((s,i)=>'<div class="row" onclick="startQ('+i+')"><span class="ic" style="background:'+s.c+'">'+s.i+'</span><div class="gr"><b>'+s.n+'</b><small class="mut">'+s.Q.length+' प्रश्न · सर्वश्रेष्ठ: '+(sc[s.id]==null?'-':sc[s.id]+'%')+'</small></div>›</div>').join('')+
  '<button class="big gold" onclick="startQ(-1)">🔀 सभी विषय मिश्रित</button></main>';
};
let qs,qi,qn,qsub,lock;
function startQ(i){qsub=i;const pool=i<0?S.flatMap(s=>s.Q):S[i].Q;qs=[...pool].sort(()=>Math.random()-.5).slice(0,10);qi=0;qn=0;go('run')}
R.run=()=>{
  lock=false;const q=qs[qi];
  app.innerHTML=hdr('प्रैक्टिस टेस्ट',"go('practice')")+'<main><div class="card"><small class="mut">प्रश्न '+(qi+1)+'/'+qs.length+'</small><div class="bar"><i style="width:'+(qi/qs.length*100)+'%;background:var(--gold)"></i></div><h3 style="display:block">'+q[0]+'</h3>'+
  q[1].map((o,j)=>'<button class="opt" data-j="'+j+'"><b>'+'ABCD'[j]+'</b> '+o+'</button>').join('')+'</div><button class="big gold" id="nx" hidden>'+(qi===qs.length-1?'परिणाम देखें':'अगला प्रश्न')+'</button></main>';
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  $('#nx').onclick=()=>{qi++;qi<qs.length?R.run():fin()};
};
function pick(j){
  if(lock)return;lock=true;const q=qs[qi];if(j===q[2])qn++;
  document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[2])b.classList.add('ok');else if(k===j)b.classList.add('bad')});
  $('#nx').hidden=false;
}
function fin(){
  const p=Math.round(qn/qs.length*100),d=ld(),key=qsub<0?'mix':S[qsub].id;
  d.sc=d.sc||{};d.sc[key]=Math.max(d.sc[key]||0,p);sv(d);act(0);
  app.innerHTML=hdr('परिणाम')+'<main><div class="card c"><h1>'+qn+'/'+qs.length+'</h1><p>'+(p>=80?'शानदार! बहुत बढ़िया 🎉':p>=50?'अच्छा प्रयास, थोड़ा और अभ्यास करें।':'दोबारा कोशिश करें, पहले नोट्स पढ़ें।')+'</p></div><button class="big gold" onclick="startQ('+qsub+')">फिर से टेस्ट दें</button><button class="big" onclick="go(\'progress\')">मेरी प्रोग्रेस देखें</button></main>';
}
R.progress=()=>{
  let tot=0,dn=0;S.forEach((s,i)=>{tot+=s.L.length;dn+=done(i)});
  app.innerHTML=hdr('मेरी प्रोग्रेस')+'<main><div class="card"><b>'+(nm()||'विद्यार्थी')+'</b><div class="three"><div><b>🔥 '+streak()+'</b><small>दिन की स्ट्रीक</small></div><div><b>📖 '+dn+'</b><small>अध्याय पूरे</small></div><div><b>🎯 '+Math.round(dn/tot*100)+'%</b><small>कुल प्रगति</small></div></div></div><h3>विषय के अनुसार प्रगति</h3>'+
  S.map((s,i)=>'<div class="card"><div class="sp"><span>'+s.i+' '+s.n+'</span><b>'+pct(i)+'%</b></div><div class="bar"><i style="width:'+pct(i)+'%;background:'+s.c+'"></i></div></div>').join('')+'</main>';
};
R.profile=()=>{
  const u=ld().u||{};
  app.innerHTML=hdr('प्रोफ़ाइल')+'<main><div class="card"><div class="av">'+(esc(u.n||'?').charAt(0).toUpperCase())+'</div><b>'+(nm()||'विद्यार्थी')+'</b><br><small class="mut">मोबाइल: '+esc(u.m||'-')+'</small></div><div class="card"><b>“सीखते रहो, सफलता ज़रूर मिलेगी।”</b></div><button class="big" id="lo">🚪 लॉगआउट</button></main>';
  $('#lo').onclick=()=>{const d=ld();delete d.u;sv(d);location.reload()};
};

let rem=1500,tm=null,endAt=0;
function draw(){const c=$('#clock');if(c)c.textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0')}
function tick(){
  rem=Math.max(0,Math.round((endAt-Date.now())/1000));draw();
  if(!rem){
    clearInterval(tm);tm=null;rem=1500;act(0);const d=ld();d.sess=(d.sess||0)+1;sv(d);
    const m=$('#tmsg');if(m)m.textContent='समय पूरा! 5 मिनट का ब्रेक लें।';
    const b=$('#tb');if(b)b.textContent='शुरू करें';
    draw();try{if(navigator.vibrate)navigator.vibrate(400)}catch(e){}
  }
}
R.timer=()=>{
  app.innerHTML=hdr('स्टडी टाइमर',"go('home')")+'<main><div class="card c"><div id="clock">25:00</div><p class="mut">25 मिनट पूरी एकाग्रता से पढ़ें, फिर 5 मिनट का ब्रेक लें।</p><button class="big gold" id="tb">शुरू करें</button><button class="big" id="tr">रीसेट</button><p id="tmsg" style="font-weight:600"></p></div></main>';
  draw();$('#tb').textContent=tm?'रोकें':(rem<1500?'जारी रखें':'शुरू करें');
  $('#tb').onclick=()=>{
    if(tm){clearInterval(tm);tm=null;$('#tb').textContent='जारी रखें'}
    else{endAt=Date.now()+rem*1000;tm=setInterval(tick,250);$('#tb').textContent='रोकें';$('#tmsg').textContent=''}
  };
  $('#tr').onclick=()=>{clearInterval(tm);tm=null;rem=1500;draw();$('#tb').textContent='शुरू करें';$('#tmsg').textContent=''};
};

/* login / register */
const gate=$('#gate');let reg=false;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function call(o){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json()}
function setMode(r){reg=r;$('#gt').textContent=r?'रजिस्टर':'लॉगिन';$('#gn').hidden=!r;$('#gb').textContent=r?'रजिस्टर करें':'लॉगिन';$('#gs').textContent=r?'पहले से खाता है? लॉगिन करें':'नया खाता बनाएँ (रजिस्टर)';$('#ge').textContent=''}
$('#gs').onclick=()=>setMode(!reg);
$('#gb').onclick=async()=>{
  const n=$('#gn').value.trim(),m=$('#gm').value.trim(),p=$('#gp').value,e=$('#ge');
  if(reg&&n.length<2){e.textContent='नाम लिखें';return}
  if(!/^[6-9][0-9]{9}$/.test(m)){e.textContent='सही 10 अंकों का मोबाइल नंबर लिखें';return}
  if(p.length<6){e.textContent='पासवर्ड कम से कम 6 अक्षर का रखें';return}
  e.textContent='कृपया रुकें...';$('#gb').disabled=true;
  try{
    const h=await sha(m+':'+p);
    const r=await call({action:reg?'register':'login',name:n,mobile:m,hash:h});
    if(r.ok){const d=ld();d.u={m:m,h:h,n:r.name};sv(d);gate.hidden=true;e.textContent='';go('home')}
    else e.textContent=r.msg||'दोबारा कोशिश करें';
  }catch(x){e.textContent='इंटरनेट या सर्वर की समस्या है। दोबारा कोशिश करें।'}
  $('#gb').disabled=false;
};
async function startGate(){
  if(!API_URL)return;
  const u=ld().u;
  if(!u){gate.hidden=false;return}
  try{const r=await call({action:'login',mobile:u.m,hash:u.h});if(!r.ok){const d=ld();delete d.u;sv(d);gate.hidden=false;$('#ge').textContent=r.msg||''}}catch(x){}
}
setMode(false);go('home');startGate();
</script>
